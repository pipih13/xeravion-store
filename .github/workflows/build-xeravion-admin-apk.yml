name: Build XERAVION Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-admin/**"
      - ".github/workflows/build-xeravion-admin-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install build packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Use official XERAVION emblem as the Android app icon
        run: |
          mkdir -p android-admin/app/src/main/res/drawable-nodpi
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/pipih13/xeravion-store/main/assets/xeravion-emblem.svg \
            -o /tmp/xeravion-emblem.svg
          rsvg-convert --width 512 --height 512 /tmp/xeravion-emblem.svg \
            --output android-admin/app/src/main/res/drawable-nodpi/xeravion_official_icon.png
          test -s android-admin/app/src/main/res/drawable-nodpi/xeravion_official_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-admin
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeravion-admin-debug-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
