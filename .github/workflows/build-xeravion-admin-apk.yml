name: Build XERAVION Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-admin/**"
      - ".github/workflows/build-xeravion-admin-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Use official XERAVION emblem as the Android app icon
        run: |
          mkdir -p android-admin/app/src/main/res/drawable-nodpi
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/pipih13/xeravion-store/main/assets/xeravion-emblem.svg \
            -o /tmp/xeravion-emblem.svg
          rsvg-convert --width 512 --height 512 /tmp/xeravion-emblem.svg \
            --output android-admin/app/src/main/res/drawable-nodpi/xeravion_official_icon.png
          test -s android-admin/app/src/main/res/drawable-nodpi/xeravion_official_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-admin
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeravion-admin-debug-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
