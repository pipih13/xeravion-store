<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8fc">
<title>XERAVION MAIL</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202124;background:#f6f8fc;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr;grid-template-rows:72px 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:22px;padding:0 26px;background:#f6f8fc}
.brand{width:220px;display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.7px;color:#30343b}.logo{width:38px;height:38px;border-radius:12px;background:#17191e;color:#e6c47c;display:grid;place-items:center;font-weight:900;font-size:20px}
.search{height:48px;max-width:720px;flex:1;background:#eaf0fb;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 18px;color:#5f6672}.search input{border:0;outline:0;background:transparent;width:100%;font:inherit;color:#202124}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px;color:#5f6672}.avatar{width:34px;height:34px;border-radius:50%;background:#dce5f5;display:grid;place-items:center;font-weight:700;color:#35435d}
aside{padding:18px 14px;background:#f6f8fc}.compose{border:0;border-radius:16px;padding:15px 22px;background:#c2e7ff;color:#102f43;font-weight:700;box-shadow:0 1px 3px #0001;margin:4px 0 22px;cursor:pointer}
nav{display:grid;gap:5px}.navitem{display:flex;align-items:center;gap:16px;text-decoration:none;color:#444b56;padding:11px 16px;border-radius:28px;font-size:14px}.navitem.active{background:#d3e3fd;color:#174ea6;font-weight:700}.navitem svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
main{margin:0 18px 18px 0;background:#fff;border-radius:18px;min-width:0;box-shadow:0 1px 2px #2021240d}
.toolbar{height:60px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid #edf0f4;color:#5f6672}.tool{border:0;background:none;color:inherit;font-size:18px;cursor:pointer;padding:6px}.refresh{margin-left:auto;font-size:13px}
.content{min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center;padding:36px}.empty{text-align:center;max-width:360px;color:#5f6672}.empty-art{width:110px;height:86px;margin:0 auto 22px;border-radius:18px;background:#f1f5fb;display:grid;place-items:center;color:#8b9bb3}.empty-art svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1.4}.empty h1{font-size:20px;font-weight:500;color:#30343b;margin:0 0 9px}.empty p{font-size:14px;line-height:1.6;margin:0}
.status{font-size:11px;color:#8b929e;margin-top:22px}
@media(max-width:720px){.shell{grid-template-columns:72px 1fr;grid-template-rows:64px 1fr}header{padding:0 12px;gap:10px}.brand{width:42px}.brand span{display:none}.logo{width:36px;height:36px}.search{height:42px;padding:0 12px}.header-right{gap:8px}.header-right .help{display:none}aside{padding:16px 8px}.compose{width:52px;height:48px;padding:0;font-size:0;border-radius:16px}.compose:after{content:"+";font-size:24px}.navitem{justify-content:center;padding:12px 8px}.navitem span{display:none}main{margin:0 8px 8px 0;border-radius:14px}.toolbar{padding:0 12px}.content{padding:22px}.refresh{font-size:11px}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand"><div class="logo">X</div><span>XERAVION MAIL</span></div>
  <label class="search" aria-label="Cari email">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input type="search" placeholder="Telusuri email" disabled>
  </label>
  <div class="header-right"><span class="help" aria-label="Bantuan">?</span><div class="avatar">X</div></div>
</header>
<aside>
  <button class="compose" type="button" disabled>Tulis</button>
  <nav aria-label="Folder email">
    <a class="navitem active" href="#" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 6.5h18v13H3z"/><path d="m3 7 9 7 9-7"/></svg><span>Kotak Masuk</span></a>
    <a class="navitem" href="#"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg><span>Berbintang</span></a>
    <a class="navitem" href="#"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 8h16M8 5v14"/></svg><span>Semua Email</span></a>
    <a class="navitem" href="#"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M4 7 12 13 20 7"/></svg><span>Spam</span></a>
    <a class="navitem" href="#"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1 13H5z"/><path d="M3 7h18M9 7V4h6v3"/></svg><span>Sampah</span></a>
  </nav>
</aside>
<main>
  <div class="toolbar">
    <button class="tool" aria-label="Pilih semua" disabled>□</button>
    <button class="tool" aria-label="Muat ulang" disabled>↻</button>
    <span class="refresh">0–0 dari 0</span>
  </div>
  <section class="content" aria-live="polite">
    <div class="empty">
      <div class="empty-art"><svg viewBox="0 0 48 48"><rect x="5" y="11" width="38" height="27" rx="4"/><path d="m7 14 17 13 17-13"/></svg></div>
      <h1>Kotak masuk kosong</h1>
      <p>Email yang diterima oleh alamat XERAVION kamu akan muncul di sini.</p>
      <div class="status">Pratinjau antarmuka · Belum terhubung ke server email</div>
    </div>
  </section>
</main>
</div>
</body>
</html>
