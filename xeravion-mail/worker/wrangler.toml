name = "xeravion-mail"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

# Create these resources in Cloudflare, then replace the placeholder ID.
[[d1_databases]]
binding = "DB"
database_name = "xeravion-mail-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MAIL_RAW"
bucket_name = "xeravion-mail"

# Set ADMIN_API_KEY with: npx wrangler secret put ADMIN_API_KEY
[vars]
APP_ORIGIN = "https://xeravion-mail.pages.dev"
